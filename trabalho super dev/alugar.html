<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Aluguel| Dongle motors</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <header class="site-header">
            <div class="container header-content">
                <a class="brand" href="index.html">Dongle Motors</a>

                <nav class="main-nav">
                    <a href="index.html">Inicio</a>
                    <a href="catalogo.html">Catálogo</a>
                    <a href="alugar.html" aria-current="page">Alugar</a>
                </nav>
            </div>
        </header>

        <h1 class="h1-alugar">
            Reservas

        </h1>

        <main>
            <section>
                <div class="questionario">
                    <form>
                        <div class="field">
                            <div>

                                <label for="nome">Nome</label>
                                <input type="text" id="nome" minlength="5" maxlength="200" required>

                                <!--se clicar no nome, já vai direto para a caixinha para digitar o nome-->
                                <!--maxlegth usa para limitar uma quantidade de caracteres-->
                                <!--required quando colocado, o usuario vai precisar prencher o campo obrigatoriamente-->
                            </div>

                            <div>

                                <label>whatsapp</label>
                                <input type="tel" placeholder="47" pattern="[0-9] {11}" required>
                            </div>

                            <div>
                                <label>Data</label>
                                <input type="date" required>
                            </div>

                            <div>

                                <label> email</label>
                                <input type="email" required>
                            </div>


                            <div class="field-alugar">
                                <label>Qual Carro deseja alugar:</label>
                                <select>
                                    <option>Puro Gasto</option>
                                    <option>Touro Louco</option>
                                    <option>Deus Kwid de mim</option>
                                </select required>
                            </div>

                            <div>
                                <label class="escrita-card">
                                    <div>Chave pix para o pagamento do carros</div>
                                    <div class="card-pix">098-098-098:98</div>
                                </label>
                            </div>



                            <div class="button-alugar">
                                <p>
                                    <button class="button button-primary" type="submit">enviar dados</button>
                                </p>
                            </div>
                    </form>
                </div>
            </section>
        </main>


        <footer class="">
            <div class="container footer-content">
                <p>1980 Dongle Motors- Blumenau, SC</p>
                <a href="reseva.html">Reservas e contatos</a>
            </div>
        </footer>

    </body>

</html>
